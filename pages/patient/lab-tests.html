<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Lab Test — SynCura</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="shell-main">
    <header class="navbar" id="navbar"></header>
    <main class="content">

      <div id="labBrowse">
        <div class="page-header"><div><h1>Book Lab Test</h1><p>Certified labs across Bangladesh · Results to your portal</p></div></div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="testGrid"></div>
      </div>

      <div id="labConfirm" class="max-w-lg mx-auto" style="display:none;">
        <div class="page-header"><div><h1>Confirm Booking</h1><p id="labConfirmSubtitle"></p></div></div>
        <div class="card p-6 space-y-4">
          <div class="form-group"><label class="form-label">Lab / Diagnostic Centre</label>
            <select id="labSelect" class="form-select">
              <option>Ibn Sina Diagnostic Centre, Dhanmondi</option>
              <option>Popular Diagnostic Centre, Mirpur</option>
              <option>Labaid Diagnostic, Dhanmondi</option>
            </select></div>
          <div class="form-group"><label class="form-label">Preferred Date</label><input type="date" id="labDate" class="form-input" value="2024-11-18"></div>
          <div class="form-group"><label class="form-label">Preferred Time</label>
            <select id="labTime" class="form-select">
              <option>7:00 AM</option><option>8:00 AM</option><option selected>9:00 AM</option>
              <option>10:00 AM</option><option>11:00 AM</option><option>12:00 PM</option>
            </select></div>
          <div class="rounded-xl p-4 space-y-2 text-sm" style="background:var(--purple-50);" id="labSummary"></div>
          <div id="labBookError" class="text-sm" style="display:none;color:var(--red-600);"></div>
          <div class="flex gap-3">
            <button class="btn btn-secondary flex-1" id="labBackBtn">Back</button>
            <button class="btn btn-brand flex-1" id="labConfirmBtn">Confirm Booking</button>
          </div>
        </div>
      </div>

      <div id="labDone" class="max-w-md mx-auto" style="display:none;padding-top:2.5rem;">
        <div class="card p-10 text-center">
          <div class="result-icon-ok"><span data-lucide="check-circle" class="icon icon-32"></span></div>
          <h2 class="text-xl font-bold text-gray-800 mb-2 font-heading">Lab Test Booked!</h2>
          <p class="text-gray-500 text-sm mb-1" id="labDoneName"></p>
          <p class="text-gray-500 text-sm mb-1" id="labDoneLab"></p>
          <p class="font-semibold my-3" style="color:var(--purple-700);" id="labDoneWhen"></p>
          <p class="text-xs text-gray-400 mb-1" id="labDoneFee"></p>
          <p class="text-xs text-gray-400 mb-6" id="labDoneTurnaround"></p>
          <button class="btn btn-brand btn-lg w-full" id="labAnotherBtn">Book Another Test</button>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>window.SC_BASE = '../../';</script>
<script src="../../js/app.js?v=9"></script>
<script src="../../js/patient.js?v=7"></script>
</body>
</html>
