<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bed Booking — SynCura</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="shell-main">
    <header class="navbar" id="navbar"></header>
    <main class="content">
      <div class="page-header"><div><h1>Bed Booking</h1><p>Request a hospital bed — the hospital reviews and approves your request</p></div></div>

      <div class="grid lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-6">
          <div class="card p-6">
            <h3 class="font-semibold text-gray-800 mb-4 font-heading">1. Choose a hospital and department</h3>
            <select id="bedHospital" class="form-select"><option value="">Select a hospital</option></select>
            <div id="bedDepts" class="grid sm:grid-cols-2 gap-3 mt-4"></div>
            <p class="text-xs text-gray-400 mt-3" id="bedDeptsHint">Bed numbers update live. A department with no free beds is closed for new requests.</p>
          </div>

          <form id="bedForm" class="card p-6" style="display:none;" novalidate>
            <h3 class="font-semibold text-gray-800 mb-1 font-heading">2. Admission details</h3>
            <p class="text-sm mb-4" style="color:var(--purple-700);" id="bedSelected"></p>
            <div class="grid sm:grid-cols-2 gap-4">
              <div class="form-group"><label class="form-label">Admission date<span class="req">*</span></label><input id="bedDate" type="date" class="form-input"></div>
              <div class="form-group"><label class="form-label">Attendant phone</label><input id="bedPhone" class="form-input" maxlength="20" placeholder="Someone we can call"></div>
              <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Reason for admission<span class="req">*</span></label><input id="bedReason" class="form-input" maxlength="255" placeholder="e.g., Chest pain, planned surgery..."></div>
              <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Notes for the hospital (optional)</label><textarea id="bedNotes" rows="3" class="form-textarea" maxlength="500" placeholder="Allergies, existing conditions, special needs..."></textarea></div>
            </div>
            <div id="bedMsg" class="text-sm rounded-xl mt-4" style="display:none;padding:.75rem 1rem;"></div>
            <button type="submit" class="btn btn-brand mt-4" id="bedSubmit">Request bed</button>
          </form>
        </div>

        <div class="card p-6 h-fit">
          <h3 class="font-semibold text-gray-800 mb-4 font-heading">My bed bookings</h3>
          <div id="myBeds"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>window.SC_BASE = '../../';</script>
<script src="../../js/app.js?v=9"></script>
<script src="../../js/patient.js?v=7"></script>
</body>
</html>
