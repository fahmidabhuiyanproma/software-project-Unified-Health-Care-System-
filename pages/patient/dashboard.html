<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Dashboard — SynCura</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="shell-main">
    <header class="navbar" id="navbar"></header>
    <main class="content">

      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 font-heading" id="greeting">Good day 👋</h1>
        <p class="text-gray-500 text-sm mt-1">Here's your health overview for today.</p>
      </div>

      <div class="rounded-2xl p-4 mb-6 flex items-center gap-4" style="background-image:linear-gradient(135deg,#5B3F8D,#8E5DAF);">
        <div style="width:2.5rem;height:2.5rem;background:rgba(255,255,255,.2);border-radius:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span data-lucide="activity" class="icon icon-20 text-white"></span>
        </div>
        <div class="flex-1">
          <div class="text-white font-semibold text-sm font-heading" id="bannerCount">You have 0 upcoming appointments</div>
          <div class="text-purple-200 text-xs" id="bannerNext"></div>
        </div>
        <a href="appointments.html" class="text-white text-xs font-semibold rounded-xl flex items-center gap-1" style="background:rgba(255,255,255,.2);padding:.5rem .75rem;">
          View <span data-lucide="arrow-right" class="icon icon-12"></span>
        </a>
      </div>

      <div class="mb-6">
        <h2 class="text-base font-semibold text-gray-700 mb-3 font-heading">Quick Actions</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
          <a href="search-doctors.html" class="card p-4 flex flex-col items-center gap-2" style="text-align:center;">
            <div class="stat-icon" style="background:#5B3F8D18;color:#5B3F8D;"><span data-lucide="search" class="icon icon-20"></span></div>
            <span class="text-xs font-medium text-gray-600">Find Doctor</span>
          </a>
          <a href="appointments.html" class="card p-4 flex flex-col items-center gap-2" style="text-align:center;">
            <div class="stat-icon" style="background:#8E5DAF18;color:#8E5DAF;"><span data-lucide="calendar" class="icon icon-20"></span></div>
            <span class="text-xs font-medium text-gray-600">Appointments</span>
          </a>
          <a href="medical-records.html" class="card p-4 flex flex-col items-center gap-2" style="text-align:center;">
            <div class="stat-icon" style="background:#B57BC418;color:#B57BC4;"><span data-lucide="file-text" class="icon icon-20"></span></div>
            <span class="text-xs font-medium text-gray-600">Records</span>
          </a>
          <a href="telemedicine.html" class="card p-4 flex flex-col items-center gap-2" style="text-align:center;">
            <div class="stat-icon" style="background:#5B3F8D18;color:#5B3F8D;"><span data-lucide="video" class="icon icon-20"></span></div>
            <span class="text-xs font-medium text-gray-600">Telemedicine</span>
          </a>
          <a href="pharmacy.html" class="card p-4 flex flex-col items-center gap-2" style="text-align:center;">
            <div class="stat-icon" style="background:#8E5DAF18;color:#8E5DAF;"><span data-lucide="shopping-bag" class="icon icon-20"></span></div>
            <span class="text-xs font-medium text-gray-600">Pharmacy</span>
          </a>
          <a href="lab-tests.html" class="card p-4 flex flex-col items-center gap-2" style="text-align:center;">
            <div class="stat-icon" style="background:#B57BC418;color:#B57BC4;"><span data-lucide="flask-conical" class="icon icon-20"></span></div>
            <span class="text-xs font-medium text-gray-600">Lab Tests</span>
          </a>
        </div>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="stat-card"><div class="stat-icon" style="background:#5B3F8D18;color:#5B3F8D;"><span data-lucide="calendar" class="icon icon-20"></span></div>
          <div><div class="stat-value" id="statAppointments">—</div><div class="stat-label">Total Appointments</div><div class="stat-sub" id="statAppointmentsSub"></div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#8E5DAF18;color:#8E5DAF;"><span data-lucide="file-text" class="icon icon-20"></span></div>
          <div><div class="stat-value" id="statRecords">—</div><div class="stat-label">Health Records</div><div class="stat-sub" id="statRecordsSub"></div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#B57BC418;color:#B57BC4;"><span data-lucide="shopping-bag" class="icon icon-20"></span></div>
          <div><div class="stat-value" id="statOrders">—</div><div class="stat-label">Medicine Orders</div><div class="stat-sub" id="statOrdersSub"></div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#5B3F8D18;color:#5B3F8D;"><span data-lucide="flask-conical" class="icon icon-20"></span></div>
          <div><div class="stat-value" id="statLabTests">—</div><div class="stat-label">Lab Tests</div><div class="stat-sub" id="statLabTestsSub"></div></div></div>
      </div>

      <div class="grid lg:grid-cols-2 gap-6">
        <div class="card">
          <div class="p-5 border-b flex items-center justify-between">
            <h2 class="font-semibold text-gray-800 font-heading">Upcoming Appointments</h2>
            <a href="appointments.html" class="text-xs font-medium" style="color:#5B3F8D;">View all</a>
          </div>
          <div class="divide-y divide-gray-50" id="dashUpcoming"></div>
        </div>

        <div class="card">
          <div class="p-5 border-b"><h2 class="font-semibold text-gray-800 font-heading">Recent Activity</h2></div>
          <div class="divide-y divide-gray-50" id="dashActivity"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>window.SC_BASE = '../../';</script>
<script src="../../js/app.js?v=9"></script>
<script src="../../js/patient.js?v=7"></script>
</body>
</html>
