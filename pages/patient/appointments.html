<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Appointments — SynCura</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="shell-main">
    <header class="navbar" id="navbar"></header>
    <main class="content">
      <div class="page-header">
        <div><h1>My Appointments</h1><p>Manage your upcoming and past appointments</p></div>
        <a href="search-doctors.html" class="btn btn-brand btn-md"><span data-lucide="plus" class="icon icon-16"></span> Book New</a>
      </div>

      <div class="flex gap-2 mb-6 card p-1 max-w-xs">
        <button class="tab-btn flex-1" data-tab="upcoming" style="padding:.5rem;border-radius:.75rem;font-size:.875rem;font-weight:600;">Upcoming</button>
        <button class="tab-btn flex-1" data-tab="past" style="padding:.5rem;border-radius:.75rem;font-size:.875rem;font-weight:600;color:var(--gray-500);">Past</button>
      </div>

      <div id="apptList" class="space-y-4"></div>
      <div id="apptEmpty" class="text-center card" style="display:none;padding:5rem 0;">
        <span data-lucide="calendar" class="icon icon-40 text-gray-200"></span>
        <p class="text-gray-500 mt-4">No appointments</p>
        <a href="search-doctors.html" class="btn btn-brand btn-md mt-4">Book an Appointment</a>
      </div>

      <div class="modal-overlay" id="cancelModal" hidden>
        <div class="modal-backdrop" id="cancelBackdrop"></div>
        <div class="modal-box">
          <h3>Cancel Appointment?</h3>
          <p class="text-sm text-gray-600 mb-6">Are you sure you want to cancel this appointment? Cancellations within 2 hours may incur a fee.</p>
          <div class="flex gap-3">
            <button class="btn btn-ghost flex-1" id="keepApptBtn">Keep Appointment</button>
            <button class="btn btn-danger flex-1" id="confirmCancelBtn">Yes, Cancel</button>
          </div>
        </div>
      </div>

      <div class="modal-overlay" id="rescheduleModal" hidden>
        <div class="modal-backdrop" id="rescheduleBackdrop"></div>
        <div class="modal-box">
          <h3>Reschedule Appointment</h3>
          <div id="rescheduleError" class="text-sm mb-2" style="display:none;color:var(--red-600);"></div>
          <div class="form-group"><label class="form-label">New Date</label><input type="date" id="rescheduleDate" class="form-input"></div>
          <div class="form-group"><label class="form-label">New Time</label><select id="rescheduleTime" class="form-select"></select></div>
          <div class="flex gap-3 pt-2">
            <button class="btn btn-ghost flex-1" id="cancelRescheduleBtn">Cancel</button>
            <button class="btn btn-brand flex-1" id="confirmRescheduleBtn">Confirm</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>window.SC_BASE = '../../';</script>
<script src="../../js/app.js?v=9"></script>
<script src="../../js/patient.js?v=7"></script>
</body>
</html>
