<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telemedicine — SynCura</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="shell-main">
    <header class="navbar" id="navbar"></header>
    <main class="content">
      <div class="page-header"><div><h1>Telemedicine Session</h1><p id="tmSubtitle">No upcoming telemedicine session</p></div></div>

      <div class="grid lg:grid-cols-3 gap-6 h-video">
        <div class="lg:col-span-2 flex flex-col gap-4">
          <div class="flex-1 min-h-300 relative overflow-hidden rounded-2xl" style="background:#111827;">
            <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=800&h=500&fit=crop&auto=format" alt="Doctor" class="w-full h-full object-cover" style="position:absolute;inset:0;opacity:.8;">
            <div style="position:absolute;inset:0;background-image:linear-gradient(to top, rgba(0,0,0,.6), transparent);"></div>
            <div class="absolute" style="top:1rem;left:1rem;background:rgba(0,0,0,.5);color:#fff;font-size:.75rem;padding:.375rem .75rem;border-radius:.5rem;" id="tmVideoLabel"></div>
            <div class="absolute flex items-center gap-2" style="top:1rem;right:1rem;background:var(--green-500);color:#fff;font-size:.75rem;padding:.25rem .625rem;border-radius:.5rem;">
              <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span> LIVE · 00:04:32
            </div>
            <div class="absolute" style="bottom:1rem;right:1rem;width:7rem;height:5rem;background:#1f2937;border-radius:.75rem;overflow:hidden;border:2px solid rgba(255,255,255,.2);">
              <div id="selfPreview" class="w-full h-full flex items-center justify-center text-white text-2xl font-bold" style="background-image:linear-gradient(to bottom right,#6b21a8,#3b0764);">F</div>
            </div>
          </div>
          <div class="card p-4 flex items-center justify-center gap-4">
            <button id="micBtn" class="tm-ctrl" style="background:var(--gray-100);color:var(--gray-700);"><span data-lucide="mic" class="icon icon-20"></span></button>
            <button id="vidBtn" class="tm-ctrl" style="background:var(--gray-100);color:var(--gray-700);"><span data-lucide="video" class="icon icon-20"></span></button>
            <button class="tm-ctrl" style="width:3.5rem;height:3.5rem;background:var(--red-500);color:#fff;"><span data-lucide="phone" class="icon icon-22" style="transform:rotate(135deg);"></span></button>
            <button class="tm-ctrl" style="background:var(--purple-100);color:var(--purple-700);"><span data-lucide="message-circle" class="icon icon-20"></span></button>
          </div>
        </div>

        <div class="card flex flex-col" style="min-height:300px;">
          <div class="p-4 border-b"><h3 class="font-semibold text-gray-800 text-sm font-heading">Session Chat</h3><p class="text-xs text-gray-400">Messages are part of your medical record</p></div>
          <div class="flex-1 overflow-y-auto p-4 space-y-3" id="chatMessages"></div>
          <div class="p-3 border-t flex gap-2">
            <input id="chatInput" class="form-input flex-1" placeholder="Type a message...">
            <button id="chatSendBtn" style="width:2.5rem;height:2.5rem;border-radius:.75rem;background:#5B3F8D;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span data-lucide="send" class="icon icon-16"></span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<style>.tm-ctrl{width:3rem;height:3rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;transition:all .15s ease;}
.tm-ctrl.active-off{background:var(--red-100)!important;color:var(--red-600)!important;}</style>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>window.SC_BASE = '../../';</script>
<script src="../../js/app.js?v=9"></script>
<script src="../../js/patient.js?v=7"></script>
</body>
</html>
