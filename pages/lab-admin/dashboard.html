<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Admin Dashboard — SynCura</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="shell-main">
    <header class="navbar" id="navbar"></header>
    <main class="content">
      <div class="page-header"><div><h1>Lab Admin Dashboard</h1><p id="labSubtitle">—</p></div></div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="stat-card"><div class="stat-icon" style="background:#5B3F8D18;color:#5B3F8D;"><span data-lucide="flask-conical" class="icon icon-20"></span></div>
          <div><div class="stat-value" id="statBookingsToday">0</div><div class="stat-label">Bookings Today</div><div class="stat-sub" id="statBookingsTodaySub">0 pending</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#16A34A18;color:#16A34A;"><span data-lucide="check-circle" class="icon icon-20"></span></div>
          <div><div class="stat-value" id="statResultsReady">0</div><div class="stat-label">Results Ready</div><div class="stat-sub">Today</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#D9770618;color:#D97706;"><span data-lucide="alert-circle" class="icon icon-20"></span></div>
          <div><div class="stat-value" id="statPendingUpload">0</div><div class="stat-label">Pending Upload</div><div class="stat-sub">Needs action</div></div></div>
      </div>

      <div class="grid lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2">
          <div class="card">
            <div class="p-5 border-b flex items-center justify-between">
              <h2 class="font-semibold text-gray-800 font-heading">Recent Bookings</h2>
              <a href="bookings.html" class="text-xs font-medium flex items-center gap-1" style="color:#5B3F8D;">View All <span data-lucide="arrow-right" class="icon icon-12"></span></a>
            </div>
            <div class="divide-y divide-gray-50" id="recentBookings"></div>
          </div>
        </div>
        <div class="card p-5 h-fit">
          <h3 class="font-semibold text-gray-800 mb-4 font-heading">Quick Actions</h3>
          <a href="catalog.html" class="flex items-center justify-between text-sm text-gray-700" style="padding:.625rem .75rem;border-radius:.75rem;margin-bottom:.25rem;">Manage Test Catalog <span data-lucide="arrow-right" class="icon icon-12 text-gray-400"></span></a>
          <a href="bookings.html" class="flex items-center justify-between text-sm text-gray-700" style="padding:.625rem .75rem;border-radius:.75rem;margin-bottom:.25rem;">View All Bookings <span data-lucide="arrow-right" class="icon icon-12 text-gray-400"></span></a>
          <a href="bookings.html" class="flex items-center justify-between text-sm text-gray-700" style="padding:.625rem .75rem;border-radius:.75rem;">Upload Results <span data-lucide="arrow-right" class="icon icon-12 text-gray-400"></span></a>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>window.SC_BASE = '../../';</script>
<script src="../../js/app.js?v=9"></script>
<script src="../../js/lab-admin.js?v=8"></script>
</body>
</html>
