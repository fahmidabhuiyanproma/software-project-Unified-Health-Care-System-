<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Catalog — SynCura</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="shell-main">
    <header class="navbar" id="navbar"></header>
    <main class="content">
      <div class="page-header">
        <div><h1>Test Catalog</h1><p id="catalogSubtitle">6 tests · Manage prices and availability</p></div>
        <button id="addTestBtn" class="btn btn-brand btn-md"><span data-lucide="plus" class="icon icon-16"></span> Add Test</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Test Name</th><th>Category</th><th>Price</th><th>Turnaround</th><th>Active</th><th>Actions</th></tr></thead>
          <tbody id="catalogBody"></tbody>
        </table>
      </div>

      <div class="modal-overlay" id="addTestModal" hidden>
        <div class="modal-backdrop" id="addTestBackdrop"></div>
        <div class="modal-box">
          <h3>Add New Test</h3>
          <div class="space-y-3">
            <div id="addTestError" class="text-sm" style="display:none;color:var(--red-600);"></div>
            <input id="testName" class="form-input" placeholder="Test Name">
            <select id="testCategory" class="form-select"><option value="">Select Category</option><option>Hematology</option><option>Biochemistry</option><option>Microbiology</option><option>Radiology</option><option>Cardiology</option><option>Endocrinology</option><option>Urology</option><option>Diabetes</option></select>
            <input id="testPrice" type="number" class="form-input" placeholder="Price (৳)">
            <input id="testTurnaround" class="form-input" placeholder="Turnaround time (e.g., 4–6 hours)">
            <textarea id="testDescription" rows="2" class="form-textarea" placeholder="Description / instructions for patient"></textarea>
            <div class="flex gap-3 pt-2">
              <button class="btn btn-ghost flex-1" id="cancelAddTest">Cancel</button>
              <button class="btn btn-brand flex-1" id="confirmAddTest">Add Test</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>window.SC_BASE = '../../';</script>
<script src="../../js/app.js?v=9"></script>
<script src="../../js/lab-admin.js?v=8"></script>
</body>
</html>
