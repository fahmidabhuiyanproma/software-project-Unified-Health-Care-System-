<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bed Requests — SynCura</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="shell-main">
    <header class="navbar" id="navbar"></header>
    <main class="content">
      <div class="page-header"><div><h1>Bed Requests</h1><p id="bedSubtitle">0 pending requests</p></div></div>

      <div class="card p-5 mb-6">
        <h3 class="font-semibold text-gray-800 mb-4 font-heading">Beds by department</h3>
        <div id="bedSummary" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <p class="text-xs text-gray-400 mt-3">Pending and approved requests each hold a bed. When a department has no free beds it stops accepting new requests.</p>
      </div>

      <div class="table-wrap">
        <table class="data-table min-w-700">
          <thead><tr><th>Patient</th><th>Department</th><th>Admission</th><th>Details</th><th>Requested</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="bedRequestsBody"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>window.SC_BASE = '../../';</script>
<script src="../../js/app.js?v=9"></script>
<script src="../../js/hospital-admin.js?v=8"></script>
</body>
</html>
